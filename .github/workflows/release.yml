name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: VoynichWorkbench-linux-x86_64
          - os: windows-latest
            artifact: VoynichWorkbench-windows-x86_64
          - os: macos-latest
            artifact: VoynichWorkbench-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build executable
        run: pyinstaller --noconfirm voynich_workbench.spec

      - name: Smoke-test executable (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/VoynichWorkbench --no-browser --port 5199 &
          SERVER=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5199/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5199/ | grep -q "Voynich Decipherment Workbench"
          kill $SERVER

      - name: Smoke-test executable (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -FilePath dist\VoynichWorkbench.exe -ArgumentList "--no-browser","--port","5199"
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5199/
              if ($r.Content -match "Voynich Decipherment Workbench") { $ok = $true; break }
            } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { exit 1 }

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          tar -czf out/${{ matrix.artifact }}.tar.gz -C dist VoynichWorkbench

      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmgroot
          cp dist/VoynichWorkbench dmgroot/
          hdiutil create -volname "Voynich Workbench" -srcfolder dmgroot \
            -ov -format UDZO out/${{ matrix.artifact }}.dmg

      - name: Build installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" packaging\windows_installer.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\VoynichWorkbench-Setup.exe out\${{ matrix.artifact }}-Setup.exe
          Compress-Archive -Path dist\VoynichWorkbench.exe -DestinationPath out\${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
